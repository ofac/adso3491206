<body class="emmet">
    <nav class="back">
        <a href="../index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"></path></svg>

    <main>
        <header class="mainmenu">
            <h1>01-Emmet</h1>
            <img src="../src/imgs/logo-emmet.svg" alt="Emmet">
            <h3>Plugin for faster HTML and CSS coding.</h3>
        </header>
        <section>
            <h2 class="subtitle">
                01-Child: > <br>
                <small>Creates child elements (nesting).</small>
            </h2>
            <h3>Example:</h3>
            <p>ul>li>a ↔️</p>
            <h3>Result:</h3>
<xmp><ul>
    <li>
        <a href=""></a>
    </li>
</ul></xmp>
        </section>
        <section>
            <h2 class="subtitle">
                02-Sibling: + <br>
                <small>Creates sibling elements.</small>
            </h2>
            <h3>Example:</h3>
            <p>section+header+nav ↔️</p>
            <h3>Result:</h3>
<xmp><section></section>
<header></header>
<nav></nav></xmp>
        </section>
    </main>
</body>
</html>
