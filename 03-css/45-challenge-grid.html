<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grid</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        body main section {
            width: 320px;
            padding: 2rem;
        }
        main section div.grid1 img,
        main section div.grid2 img {
            border: none;
            margin: 0;
        }

        div.grid1 {
            display: grid;
            margin-bottom: 2rem;
            grid-gap: 0.6rem;
            grid-template-areas: "one  two three"
                                 "four two five"
                                 "six six seven";
        }
        div.grid1 img {
            border-radius: 12px;
            corner-shape: squircle;
            outline: 2px solid #fff;
            height: 100px;
            object-fit: cover;
            width: 100px;
        }
        div.grid1 img.img01 { grid-area: one; }
        div.grid1 img.img02 { 
            height: calc(100px * 2 + 0.8rem);
            grid-area: two;  
        }
        div.grid1 img.img03 { grid-area: three; }
        div.grid1 img.img04 { grid-area: four; }
        div.grid1 img.img05 { grid-area: five; }
        div.grid1 img.img06 { 
            grid-area: six; 
            width: calc(100px * 2 + 0.8rem);
        }
        div.grid1 img.img07 { grid-area: seven; }
        /* - - - - - - - - - - - - - - */
        div.grid2 {
            display: grid;
            margin-bottom: 0.2rem;
            grid-gap: 0.6rem;
            grid-template-areas: "one one two three"
                                 "one one four four"
                                 "five six four four";
        }

        div.grid2 img {
            border-radius: 12px;
            corner-shape: squircle;
            outline: 2px solid #fff;
            height: 75px;
            object-fit: cover;
            width: 75px;
        }
        div.grid2 img.img01 { 
            height: calc(75px * 2 + 0.6rem);
            width: calc(75px * 2 + 0.6rem);
            grid-area: one; 
        }
        div.grid2 img.img02 { grid-area: two; }
        div.grid2 img.img03 { grid-area: three; }
        div.grid2 img.img04 { 
            height: calc(75px * 2 + 0.6rem);
            width: calc(75px * 2 + 0.6rem);
            grid-area: four; 
        }
        div.grid2 img.img05 { grid-area: five; }
        div.grid2 img.img06 { grid-area: six; }

    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>45-Challenge Grid</h1>
            <img src="../src/imgs/logo-css.png" alt="Css">
            <h3>Irregular Gallery: Grid Areas</h3>
        </header>
        <section>
            <h2 class="subtitle">Example 01:</h2>
            <div class="grid1">
                <img class="img01" src="imgs/grid/gris-01.png" alt="01">
                <img class="img02" src="imgs/grid/gris-02.png" alt="02">
                <img class="img03" src="imgs/grid/gris-03.png" alt="03">
                <img class="img04" src="imgs/grid/gris-04.png" alt="04">
                <img class="img05" src="imgs/grid/gris-05.png" alt="05">
                <img class="img06" src="imgs/grid/gris-06.png" alt="06">
                <img class="img07" src="imgs/grid/gris-07.png" alt="07">
            </div>
            <h2 class="subtitle">Example 02:</h2>
            <div class="grid2">
                <img class="img01" src="imgs/grid/neva-01.png" alt="01">
                <img class="img02" src="imgs/grid/neva-02.png" alt="02">
                <img class="img03" src="imgs/grid/neva-03.png" alt="03">
                <img class="img04" src="imgs/grid/neva-04.png" alt="04">
                <img class="img05" src="imgs/grid/neva-05.png" alt="05">
                <img class="img06" src="imgs/grid/neva-06.png" alt="06">
            </div>
        </section>
    </main>
</body>
</html>
